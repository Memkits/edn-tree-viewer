name: Prepare isolated EDN Tree acceptance
on:
  push:
    branches: [prepare/edn-tree-viewer-runtime031]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable && corepack prepare yarn@4.18.0 --activate
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          caps-version: "0.1.1"
          deps-file: deps.cirru
      - name: Validate exact source and formal graph
        run: |
          set -euo pipefail
          mkdir -p acceptance
          test "$(git hash-object calcit.cirru)" = de89cb307e51cd43262fdb308be3376cb66e5ab3
          caps --strict --ci
          yarn install --immutable
          caps verify --toolchain
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only --all-defs --format json > acceptance/all-defs.json
          calcit calcit.cirru fix --workflow strict --verify --format json > acceptance/strict.json
          jq -e '.data.workflow.status == "passed" and .diagnostics == []' acceptance/strict.json
          calcit calcit.cirru test --require-match
          calcit calcit.cirru analyze weak-types --only coverage --format json > acceptance/coverage.json
      - name: Build exact application for local acceptance
        env:
          VITE_BASE_URL: ./
        run: |
          set -euo pipefail
          yarn build
          cp -R dist acceptance/dist
          git diff --exit-code -- calcit.cirru
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: edn-tree-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: acceptance
          if-no-files-found: error
          retention-days: 7
